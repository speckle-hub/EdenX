<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenX | Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127800;</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="header" id="header">
        <a href="index.html" class="logo">
            <span class="eden">Eden</span><span class="x">X</span>
        </a>
        
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="pornstars.html">Pornstars</a></li>
                <li><a href="trending.html">Trending</a></li>
                <li><a href="new.html">New</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <div class="search-container">
                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="Search videos..." id="searchInput">
                    <button type="button" id="searchBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" style="margin-top: 70px;">
        
        <div class="section-header" style="margin-bottom: 2rem;">
            <h2 class="section-title" style="font-size: 1.75rem;">
                <span class="icon">&#128269;</span> Search Results
                <span class="count" id="searchCount"></span>
            </h2>
        </div>
        
        <div class="video-grid" id="searchResults">
            <!-- Populated by JS -->
        </div>
        
        <div id="noResults" class="hidden" style="text-align: center; padding: 4rem 2rem;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">&#128269;</div>
            <h2 style="margin-bottom: 0.5rem;">No results found</h2>
            <p style="color: var(--text-muted); max-width: 400px; margin: 0 auto;">
                We couldn't find any videos matching your search. Try different keywords or browse our categories.
            </p>
            <a href="categories.html" class="btn btn-primary" style="margin-top: 1.5rem;">Browse Categories</a>
        </div>
        
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <span>&copy; 2026 EdenX. All rights reserved.</span>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
