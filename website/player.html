<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdenX | Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127800;</text></svg>">
</head>
<body>

    <!-- Header -->
    <header class="header" id="header">
        <a href="index.html" class="logo">
            <span class="eden">Eden</span><span class="x">X</span>
        </a>
        
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="pornstars.html">Pornstars</a></li>
                <li><a href="trending.html">Trending</a></li>
                <li><a href="new.html">New</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <div class="search-container">
                <div class="search-bar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="Search videos..." id="searchInput">
                    <button type="button" id="searchBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Player Page -->
    <div class="player-page">
        <div class="player-container">
            <!-- Main Player -->
            <div>
                <div class="video-player-wrapper" id="playerWrapper">
                    <!-- Embed iframe will be loaded here -->
                    <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#111;">
                        <div style="text-align:center;color:#666;">
                            <div style="font-size:3rem;margin-bottom:1rem;">&#127909;</div>
                            <p>Loading video...</p>
                        </div>
                    </div>
                </div>

                <div class="player-info">
                    <h1 class="player-title" id="videoTitle">Loading...</h1>
                    
                    <div class="player-meta">
                        <div class="player-meta-item">
                            <span class="icon">&#128065;</span>
                            <span id="videoViews">-- views</span>
                        </div>
                        <div class="player-meta-item">
                            <span class="icon">&#128197;</span>
                            <span id="videoDate">--</span>
                        </div>
                        <div class="player-meta-item">
                            <span class="icon">&#11088;</span>
                            <span id="videoRating">--</span>
                        </div>
                        <div class="player-meta-item source-badge" id="videoSource">
                            <span class="icon">&#128279;</span>
                            <span>--</span>
                        </div>
                    </div>

                    <div class="player-tags" id="videoTags">
                        <!-- Populated by JS -->
                    </div>

                    <div class="player-actions">
                        <button class="btn btn-secondary btn-sm" id="likeBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                            Like
                        </button>
                        <button class="btn btn-secondary btn-sm" id="favoriteBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                            Favorite
                        </button>
                        <button class="btn btn-secondary btn-sm" id="shareBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            Share
                        </button>
                        <a href="#" class="btn btn-secondary btn-sm" id="downloadBtn" target="_blank">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Visit Source
                        </a>
                    </div>
                </div>
            </div>

            <!-- Related Videos -->
            <div class="related-videos">
                <h3 class="related-videos-title">Related Videos</h3>
                <div id="relatedVideos">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom" style="border-top:none;margin-top:0;padding-top:0;">
            <span>&copy; 2026 EdenX. All rights reserved.</span>
            <span>18 U.S.C. 2257 Record-Keeping Requirements Compliance Statement</span>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
